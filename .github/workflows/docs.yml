name: Documentation

on:
  pull_request:
    paths:
      - "products/growth/docs/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "products/growth/docs/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  internal:
    name: Build internal documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: products/growth/docs/internal-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: products/growth/docs/internal-site/.nvmrc
          cache: pnpm
          cache-dependency-path: products/growth/docs/internal-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Build site
        run: pnpm --ignore-workspace build

  public:
    name: Build public documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: products/growth/docs/public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: products/growth/docs/public/.nvmrc
          cache: pnpm
          cache-dependency-path: products/growth/docs/public/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Build site
        run: pnpm --ignore-workspace build
