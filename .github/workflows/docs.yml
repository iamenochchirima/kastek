name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - ".gitignore"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  internal:
    name: Build internal documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/internal-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: docs/internal-site/.nvmrc
          cache: pnpm
          cache-dependency-path: docs/internal-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

  public:
    name: Build public documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: docs/public/.nvmrc
          cache: pnpm
          cache-dependency-path: docs/public/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
