name: Observability foundation

on:
  pull_request:
    paths:
      - ".github/workflows/observability.yml"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - "server/crates/**"
      - "server/kasitek-core/src/**"
      - "server/kasitek-core/src/main.rs"
      - "docs/internal/development/local-development.md"
      - "docs/internal/operations/**"
      - "docs/plans/active/OPENTELEMETRY_INFRASTRUCTURE_*.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/observability.yml"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - "server/crates/**"
      - "server/kasitek-core/src/**"
      - "server/kasitek-core/src/main.rs"
      - "docs/internal/development/local-development.md"
      - "docs/internal/operations/**"
      - "docs/plans/active/OPENTELEMETRY_INFRASTRUCTURE_*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust telemetry checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Reject new legacy Rust log macros
        run: |
          set -euo pipefail
          if rg -n 'log::(trace|debug|info|warn|error)!' server \
            --glob '*.rs'; then
            echo 'Operational Rust log macros must use the shared observability tracing API.'
            exit 1
          fi

      - name: Check workspace
        working-directory: server
        run: cargo check --workspace

      - name: Test instrumented Rust services
        working-directory: server
        run: |
          cargo test -p kasitek-core --lib
