name: Native Core observability

# Local verification does not depend on Actions. Run this manually only when
# private source access and the pinned Labs commit are available remotely.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native Core telemetry checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Growth
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.30.1
      - name: Resolve pinned private source
        id: shared-source
        env:
          LABS_SOURCE_READ_TOKEN: ${{ secrets.LABS_SOURCE_READ_TOKEN }}
        run: |
          test -n "$LABS_SOURCE_READ_TOKEN" || { echo 'Configure private Labs source read access first'; exit 1; }
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { sourceCommit } = JSON.parse(readFileSync('server/kasitek-core/shared-packages.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(sourceCommit)) throw Error('Invalid pinned source commit');
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${sourceCommit}\n`);
          JS
      - name: Check out private pinned Labs source
        uses: actions/checkout@v4
        with:
          repository: Kasitek-Labs/kasitek-labs
          ref: ${{ steps.shared-source.outputs.commit }}
          token: ${{ secrets.LABS_SOURCE_READ_TOKEN }}
          path: .native-ci/labs
          persist-credentials: false
      - name: Verify native Core
        run: bash scripts/verify_native_core.sh .native-ci/labs
