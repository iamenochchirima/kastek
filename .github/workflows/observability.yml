name: Native Core observability

# Focused checks use workspace packages and no private sibling checkout.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native Core telemetry checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Growth
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.30.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @kasitek-labs/contracts build && pnpm --filter @kasitek-labs/server-support build
      - name: Build Core
        run: pnpm --dir products/growth/api build
      - name: Verify native Core telemetry
        working-directory: products/growth/api
        run: pnpm exec tsx --test tests/foundation.test.ts tests/growth-agent-telemetry.test.ts tests/legacy-runtime-cutover.test.ts tests/observability.test.ts
