name: Agents source checks

on:
  pull_request:
    paths:
      - ".github/workflows/agents.yml"
      - "products/agents/**"
      - "products/agents/api/scripts/**"
      - "products/agents/api/src/**"
      - "products/agents/api/package.json"
      - "packages/contracts/**"
      - "packages/server-support/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "products/agents/api/tsconfig.json"
      - "products/agents/api/vitest.config.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agents.yml"
      - "products/agents/**"
      - "products/agents/api/scripts/**"
      - "products/agents/api/src/**"
      - "products/agents/api/package.json"
      - "packages/contracts/**"
      - "packages/server-support/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "products/agents/api/tsconfig.json"
      - "products/agents/api/vitest.config.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Agents source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:cd4ccfdaf62cbfeb5c6ee19ef0dd663406d4ed740c320b324d016a90e85385b3
        env:
          POSTGRES_USER: agents_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared dependencies
        run: pnpm build:shared

      - name: Install Playwright Chromium
        run: pnpm --dir products/agents/web exec playwright install --with-deps chromium

      - name: Type-check Agents source
        run: pnpm --dir products/agents/api exec tsc -p tsconfig.json --noEmit

      - name: Verify platform contracts, fresh database and HTTP boundaries
        env:
          AGENTS_TEST_DATABASE_URL: postgresql://agents_test:local-test-only@127.0.0.1:5432/postgres
        run: pnpm --filter @kasitek/agents test --maxWorkers=2

      - name: Build platform and interface
        run: pnpm build:agents

      - name: Verify Restate recovery and cancellation contracts
        run: bash infra/agents-runtime/verify.sh
