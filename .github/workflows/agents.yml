name: Agents source checks

on:
  pull_request:
    paths:
      - ".github/workflows/agents.yml"
      - "products/agents/**"
      - "products/agents/packages/**"
      - "products/agents/scripts/**"
      - "products/agents/src/**"
      - "products/agents/package.json"
      - "packages/contracts/**"
      - "packages/server-support/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "products/agents/tsconfig.json"
      - "products/agents/tsconfig.scripts.json"
      - "products/agents/vitest.config.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agents.yml"
      - "products/agents/**"
      - "products/agents/packages/**"
      - "products/agents/scripts/**"
      - "products/agents/src/**"
      - "products/agents/package.json"
      - "packages/contracts/**"
      - "packages/server-support/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "products/agents/tsconfig.json"
      - "products/agents/tsconfig.scripts.json"
      - "products/agents/vitest.config.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Agents source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @kasitek-labs/contracts build

      - name: Type-check Agents source
        run: pnpm --dir products/agents exec tsc -p tsconfig.json --noEmit

      - name: Type-check repository scripts
        run: pnpm --dir products/agents exec tsc -p tsconfig.scripts.json

      - name: Verify API health when Collector is unavailable
        run: pnpm --dir products/agents run test:telemetry:collector-unavailable

      - name: Verify independent deployment descriptors
        run: pnpm --dir products/agents exec vitest run test/deployment-config.test.ts

      - name: Build local MCP package
        run: pnpm --dir products/agents run build:mcp
