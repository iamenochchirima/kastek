name: Agents source checks

on:
  pull_request:
    paths:
      - ".github/workflows/agents.yml"
      - "migrations/**"
      - "packages/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsconfig.scripts.json"
      - "vitest.config.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agents.yml"
      - "migrations/**"
      - "packages/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsconfig.scripts.json"
      - "vitest.config.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Agents source
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Type-check repository scripts
        run: pnpm exec tsc -p tsconfig.scripts.json

      - name: Verify API health when Collector is unavailable
        run: pnpm run test:telemetry:collector-unavailable

      - name: Build local MCP package
        run: pnpm run build:mcp
