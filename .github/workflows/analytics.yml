name: Analytics foundation

on:
  pull_request:
    paths:
      - ".github/workflows/analytics.yml"
      - "ANALYTICS_PLAN.md"
      - "ANALYTICS_EXECUTION_PLAN.md"
      - "scripts/run_local_stack.sh"
      - "scripts/test-analytics-e2e.sh"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - "server/crates/observability/**"
      - "server/kasitek-analytics/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytics.yml"
      - "ANALYTICS_PLAN.md"
      - "ANALYTICS_EXECUTION_PLAN.md"
      - "scripts/run_local_stack.sh"
      - "scripts/test-analytics-e2e.sh"
      - "server/Cargo.toml"
      - "server/Cargo.lock"
      - "server/crates/observability/**"
      - "server/kasitek-analytics/**"

permissions:
  contents: read

jobs:
  analytics-static:
    name: Analytics static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: server
        run: cargo fmt --manifest-path kasitek-analytics/Cargo.toml -- --check

      - name: Run Analytics tests
        working-directory: server
        run: cargo test --manifest-path kasitek-analytics/Cargo.toml

      - name: Validate Analytics contract and metric registries
        working-directory: server
        run: cargo run --quiet --manifest-path kasitek-analytics/Cargo.toml --bin analytics-registry -- --check

      - name: Run Analytics Clippy
        working-directory: server
        run: cargo clippy --manifest-path kasitek-analytics/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Check the Rust workspace
        working-directory: server
        run: cargo check --workspace

      - name: Check shell scripts
        run: bash -n scripts/run_local_stack.sh scripts/test-analytics-e2e.sh server/kasitek-analytics/scripts/*.sh

      - name: Validate the optional Compose deployment shape
        run: docker compose -f server/kasitek-analytics/compose.yaml config --quiet

  analytics-foundation-e2e:
    name: Analytics foundation E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kasitek_analytics_e2e
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d kasitek_analytics_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run the bounded Analytics foundation E2E
        env:
          ANALYTICS_E2E_DATABASE_URL: postgres://analytics:analytics_e2e_password@127.0.0.1:5432/kasitek_analytics_e2e
          ANALYTICS_E2E_REDIS_URL: redis://127.0.0.1:6379
          ANALYTICS_E2E_METRICS_TOKEN: ci-analytics-metrics-token
        run: ./scripts/test-analytics-e2e.sh --ci
