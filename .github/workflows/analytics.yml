name: Analytics service

on:
  pull_request:
    paths:
      - ".github/workflows/analytics.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/observability/**"
      - "services/analytics/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytics.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/observability/**"
      - "services/analytics/**"

permissions:
  contents: read

jobs:
  analytics:
    name: Check Analytics ownership package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Analytics binaries
        run: cargo check -p kasitek-analytics --bins

      - name: Check generated Analytics bindings
        run: cargo run -p kasitek-analytics --bin analytics-registry -- --check

      - name: Validate local service shape
        run: docker compose -f services/analytics/compose.yaml config --quiet
