name: Agent Platform UI

on:
  pull_request:
    paths:
      - ".github/workflows/agent-platform-ui.yml"
      - "client/apps/agent-platform/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-platform-ui.yml"
      - "client/apps/agent-platform/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-agent-platform-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kasitek/agent-platform typecheck
      - run: pnpm --filter @kasitek/agent-platform build
