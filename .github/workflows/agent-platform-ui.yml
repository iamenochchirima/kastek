name: Agent Platform UI

on:
  pull_request:
    paths:
      - ".github/workflows/agent-platform-ui.yml"
      - "products/agents/web/**"
      - "products/agents/api/package.json"
      - "packages/contracts/**"
      - "packages/server-support/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-platform-ui.yml"
      - "products/agents/web/**"
      - "products/agents/api/package.json"
      - "packages/contracts/**"
      - "packages/server-support/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent-platform-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kasitek/agent-platform typecheck
      - run: pnpm --filter @kasitek/agent-platform build
      - name: Install browser runtime
        run: pnpm --filter @kasitek/agent-platform exec playwright install --with-deps chromium
      - name: Verify interface with controlled API fixtures
        run: pnpm --filter @kasitek/agent-platform test:ci
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agents-interface-failures
          path: products/agents/web/.artifacts/browser
          if-no-files-found: ignore
