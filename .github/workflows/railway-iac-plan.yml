name: Railway IaC plan

on:
  pull_request:
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node for the IaC package
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway IaC dependencies
        run: npm ci --prefix .railway

      - name: Require the Railway staging project token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error title=Missing Railway token::Add RAILWAY_TOKEN as a GitHub Actions secret using a Railway project token scoped to the staging environment."
            exit 1
          fi

      - name: Preview the Railway environment changes
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8
        with:
          command: plan
          cli-version: 5.63.1
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
