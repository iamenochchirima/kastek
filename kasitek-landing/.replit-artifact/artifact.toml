kind = "web"
previewPath = "/"
title = "KasiTek Landing Page"
version = "1.0.0"
id = "artifacts/kasitek-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21721
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/kasitek-landing run dev"

[services.env]
PORT = "21721"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/kasitek-landing", "run", "build"]
publicDir = "artifacts/kasitek-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
