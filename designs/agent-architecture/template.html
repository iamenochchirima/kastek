<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent architecture · KasiTek</title><style>
:root{color-scheme:dark light;--bg:light-dark(#f5f6f8,#111215);--panel:light-dark(#fff,#1b1d22);--text:light-dark(#20232b,#eeeef3);--muted:light-dark(#596171,#a7adba);--line:light-dark(#d9dce4,#393c47);--accent:light-dark(#71469e,#c8a7ec);--soft:light-dark(#f1eaf8,#30263e);--product:light-dark(#eaf2fc,#202e42);--green:light-dark(#216844,#9bd8b0);--config-fill:light-dark(#fff2da,#3a2e1d);--config-line:light-dark(#b17a25,#c69b56);--context-fill:light-dark(#e8f5ee,#1e342b);--context-line:light-dark(#43805c,#6b9e7e);--adapter-line:light-dark(#678ab6,#6785b0)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}button,select,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:19px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:12px}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100dvh - 95px)}nav{padding:20px 14px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin-bottom:8px;background:transparent;border-color:transparent}nav button[aria-current=true]{background:var(--soft);border-color:var(--accent)}nav small{display:block;color:var(--muted);margin-left:26px}.content{min-width:0;padding:22px}.heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h2{font-size:21px;margin:0}#description{color:var(--muted);max-width:850px;margin:6px 0 14px}.tag{font-size:11px;color:var(--accent);white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:4px 10px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar output{min-width:50px;text-align:center;color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-left:auto}.viewport{height:650px;max-height:72dvh;min-height:350px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);touch-action:pan-x pan-y;cursor:grab}.viewport.dragging{cursor:grabbing}.viewport svg{display:block;max-width:none;user-select:none}.viewport svg text{font-family:system-ui,sans-serif;fill:var(--text)}.viewport .muted{fill:var(--muted)}.viewport .box{fill:var(--panel);stroke:var(--line);stroke-width:1.3}.viewport .product{fill:var(--product);stroke:var(--adapter-line)}.viewport .configuration{fill:var(--config-fill);stroke:var(--config-line)}.viewport .scope{fill:var(--context-fill);stroke:var(--context-line)}.viewport .runtime{fill:var(--soft);stroke:var(--accent);stroke-width:1.5}.viewport .component{fill:var(--panel);stroke:var(--line)}.viewport .edge{fill:none;stroke:var(--muted);stroke-width:1.5}.viewport .config-edge{stroke-dasharray:5 5}.viewport .edge-policy{stroke:var(--config-line);stroke-dasharray:6 4}.viewport .edge-call{stroke:var(--adapter-line)}.viewport .edge-label{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.toolbar[hidden]{display:none}.toolbar button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 18px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--soft);border:1px solid var(--accent)}.dot.blue{background:var(--product);border-color:var(--adapter-line)}.dot.amber{background:var(--config-fill);border-color:var(--config-line)}.dot.green{background:var(--context-fill);border-color:var(--context-line)}.notes{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;border-top:1px solid var(--line);padding-top:18px}.notes label{display:block;font-weight:600;margin-bottom:8px}textarea{display:block;width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px}small,#saved{color:var(--muted);font-size:12px}.notes p{margin:0 0 8px}.mobile-select{display:none}footer{font-size:12px;color:var(--muted);margin-top:20px}@media(max-width:800px){header{padding:16px}.shell{display:block}nav{display:none}.content{padding:16px}.mobile-select{display:block;width:100%;margin-bottom:16px}.notes{grid-template-columns:1fr}.hint{width:100%;margin:0}.viewport{height:60dvh;min-height:320px}.heading{display:block}.tag{display:inline-block;margin:8px 0}}
