[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kasitek-harbor"
version = "0.1.0"
description = "External Harbor adapter for authorized Kasitek execution trials"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["harbor==0.24.0", "httpx==0.28.1", "pydantic==2.14.1"]

[project.optional-dependencies]
dev = ["ruff==0.14.1"]

[tool.setuptools.packages.find]
where = ["src"]
