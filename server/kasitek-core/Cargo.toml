[package]
name = "kasitek-core"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web.workspace = true
actix-cors.workspace = true
actix-multipart = "0.7"
async-trait.workspace = true

tokio.workspace = true

sqlx.workspace = true

serde.workspace = true
serde_json.workspace = true

chrono.workspace = true
bcrypt = "0.15"
cuid2 = "0.1"
urlencoding = "2.1"

reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
redis = { version = "0.27", features = ["tokio-comp"] }

log.workspace = true
dotenv.workspace = true
thiserror.workspace = true
base64.workspace = true
rand.workspace = true
csv = "1.3"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
regex = "1"
web-push = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
config = { path = "../crates/config" }
crypto-utils = { path = "../crates/crypto-utils" }
observability = { path = "../crates/observability" }
types = { path = "../crates/types" }
actions = { path = "../crates/actions" }
analytics-producer = { path = "../crates/analytics-producer" }
execution = { path = "../crates/execution" }
semver.workspace = true
jwt-simple = "0.11"

[[bin]]
name = "server"
path = "src/main.rs"
