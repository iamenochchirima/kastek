[package]
name = "kasitek-core"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web.workspace = true
actix-cors.workspace = true
actix-multipart = "0.7"
async-trait.workspace = true

tokio.workspace = true

sqlx.workspace = true

serde.workspace = true
serde_json.workspace = true

chrono.workspace = true
bcrypt = "0.15"
cuid2 = "0.1"
urlencoding = "2.1"
url.workspace = true

reqwest = { workspace = true, features = ["multipart", "stream"] }
redis = { version = "0.27", features = ["tokio-comp"] }

log.workspace = true
dotenv.workspace = true
thiserror.workspace = true
base64.workspace = true
rand.workspace = true
csv = "1.3"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
regex = "1"
web-push = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
config.workspace = true
crypto-utils.workspace = true
observability.workspace = true
types = { path = "../crates/types" }
actions = { path = "../crates/actions" }
analytics-producer.workspace = true
analytics-reporting.workspace = true
execution = { path = "../crates/execution" }
semver.workspace = true
jwt-simple = "0.11"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
jsonwebtoken = "9"

[[bin]]
name = "server"
path = "src/main.rs"
