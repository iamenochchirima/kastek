kind: metrics
definitions:
  - key: connection.lifecycle_events
    version: 1
    domain: connections
    owner: core-connections
    lifecycle: active
    description: Connection creation and status transitions observed by Core.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - connection.lifecycle@1
    formula: count(connection.lifecycle@1)
    eligible_population: Core ExternalConnection rows created or transitioned by an authoritative synchronization or status command
    exclusions: [display names, handles, provider account identifiers, credentials, tokens, provider payloads, and raw errors]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: source_entity
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization]
    dimensions: [provider, lifecycle_action, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [connection.lifecycle@1]}
    availability: when_instrumented
    effective_from: "2026-08-24T00:00:00Z"
    applicability: Core connection synchronization or lifecycle status commands are instrumented
    dependencies: []

  - key: connection.health_checks
    version: 1
    domain: connections
    owner: core-connections
    lifecycle: active
    description: Connection health checks recorded by Core.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - connection.health_check@1
    formula: count(connection.health_check@1)
    eligible_population: Core connection health checks with a bounded result and current connection state
    exclusions: [display names, handles, provider account identifiers, credentials, tokens, provider payloads, and raw errors]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization]
    dimensions: [provider, status, connection_health_status, connection_credential_status, connection_webhook_status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [connection.health_check@1]}
    availability: when_instrumented
    effective_from: "2026-08-24T00:00:00Z"
    applicability: Core connection health checks are instrumented
    dependencies: []

  - key: connection.capability_events
    version: 1
    domain: connections
    owner: core-connections
    lifecycle: active
    description: Connection capability enablement transitions observed by Core.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - connection.capability.lifecycle@1
    formula: count(connection.capability.lifecycle@1)
    eligible_population: Core connection capability states created or changed by the authoritative capability projection
    exclusions: [display names, handles, provider account identifiers, credentials, tokens, provider payloads, and raw errors]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: source_entity
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization]
    dimensions: [provider, capability, lifecycle_action]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [connection.capability.lifecycle@1]}
    availability: when_instrumented
    effective_from: "2026-08-24T00:00:00Z"
    applicability: Core connection capability projection changes are instrumented
    dependencies: []

  - key: connection.sync_attempts
    version: 1
    domain: connections
    owner: core-connections
    lifecycle: active
    description: Provider synchronization attempts and bounded outcomes recorded by Core.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - connection.sync_attempt@1
    formula: count(connection.sync_attempt@1)
    eligible_population: Core provider refresh and identity synchronization attempts with a durable bounded outcome
    exclusions: [display names, handles, provider account identifiers, credentials, tokens, provider payloads, raw provider errors, and customer content]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization]
    dimensions: [provider, connection_sync_operation, outcome, failure_class]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [connection.sync_attempt@1]}
    availability: when_instrumented
    effective_from: "2026-08-24T00:00:00Z"
    applicability: Core WhatsApp connection refresh and social identity refresh paths are instrumented
    dependencies: []

  - key: connection.rate_limit_encounters
    version: 1
    domain: connections
    owner: core-connections
    lifecycle: active
    description: Provider rate-limit encounters observed during instrumented connection operations.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - connection.rate_limit@1
    formula: count(connection.rate_limit@1)
    eligible_population: Core connection operations receiving a provider rate-limit response
    exclusions: [display names, handles, provider account identifiers, credentials, tokens, provider payloads, raw provider errors, and customer content]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization]
    dimensions: [provider, connection_sync_operation, rate_limit_scope]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [connection.rate_limit@1]}
    availability: when_instrumented
    effective_from: "2026-08-24T00:00:00Z"
    applicability: Instrumented Core connection refresh operations classify provider 429 responses
    dependencies: []

  - key: connection.incidents
    version: 1
    domain: connections
    owner: core-connections
    lifecycle: active
    description: Connection health incident openings and recoveries derived from authoritative health transitions.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - connection.incident.lifecycle@1
    formula: count(connection.incident.lifecycle@1)
    eligible_population: Core connection health transitions that open or resolve a customer-visible connection incident
    exclusions: [display names, handles, provider account identifiers, credentials, tokens, provider payloads, raw provider errors, and customer content]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization]
    dimensions: [provider, lifecycle_action, incident_severity, incident_reason_code]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [connection.incident.lifecycle@1]}
    availability: when_instrumented
    effective_from: "2026-08-24T00:00:00Z"
    applicability: Core connection health updates are instrumented; incident history is not backfilled from current rows
    dependencies: []
