kind: metrics
definitions:
  - key: agent.runs.completed
    version: 1
    domain: agents
    owner: agent-platform
    lifecycle: active
    description: Completed agent runs.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - agent.run.completed@1
    formula: count(agent.run.completed@1)
    eligible_population: eligible agent runs emitted by active installations
    exclusions: []
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [agent_definition, agent_version, agent_installation, outcome, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [agent.run.completed@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: agent installation emits completed-run facts
    dependencies: []

