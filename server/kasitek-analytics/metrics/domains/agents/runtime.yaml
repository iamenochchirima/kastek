kind: metrics
definitions:
  - key: agent.runs.completed
    version: 1
    domain: agents
    owner: agent-platform
    lifecycle: active
    description: Completed agent runs.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - agent.run.completed@1
    formula: count(agent.run.completed@1)
    eligible_population: eligible agent runs emitted by active installations
    exclusions: []
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [agent_definition, agent_version, agent_installation, outcome, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [agent.run.completed@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: agent installation emits completed-run facts
    dependencies: []

  - key: agent.runs.failed
    version: 1
    domain: agents
    owner: agent-platform
    lifecycle: active
    description: Failed agent runs.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - agent.run.failed@1
    formula: count(agent.run.failed@1)
    eligible_population: eligible agent runs emitted by active installations
    exclusions: []
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [agent_definition, agent_version, agent_installation, failure_class, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [agent.run.failed@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: agent installation emits failed-run facts
    dependencies: []

  - key: agent.model_calls.completed
    version: 1
    domain: agents
    owner: agent-platform
    lifecycle: active
    description: Completed model calls made by Agent Platform.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - agent.model_call.completed@1
    formula: count(agent.model_call.completed@1)
    eligible_population: model calls with a committed completed response
    exclusions: []
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [agent_definition, agent_version, agent_installation, model_provider, model, funding_source, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [agent.model_call.completed@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: Agent Platform records completed model-call facts
    dependencies: []

  - key: agent.model_calls.failed
    version: 1
    domain: agents
    owner: agent-platform
    lifecycle: active
    description: Failed model calls made by Agent Platform.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - agent.model_call.failed@1
    formula: count(agent.model_call.failed@1)
    eligible_population: model calls with a committed failure outcome
    exclusions: []
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
