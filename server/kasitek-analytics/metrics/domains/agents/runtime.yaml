  - key: agent.conversation.response_time_ms
    version: 1
    domain: agents
    owner: agent-platform
    lifecycle: active
    description: Time from the latest customer message to an Agent or human response.
    value_type: duration
    unit: milliseconds
    precision: 0
    sources:
      - agent.conversation.message@1
    formula: average(agent.conversation.message@1, response_time_ms)
    eligible_population: outbound Agent or human messages with a measured preceding customer message
    exclusions: [messages without a preceding customer message, delivery updates, personal-agent messages]
    time_semantics: event_time
    default_aggregation: weighted_average
    temporal_aggregation: weighted_average
    comparison: previous_period
    deduplication: source_entity
    descendant_aggregation: weighted_average
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [agent_definition, agent_version, agent_installation, agent_audience, agent_conversation_channel, message_responder_type]
    permissions: [analytics:read]
