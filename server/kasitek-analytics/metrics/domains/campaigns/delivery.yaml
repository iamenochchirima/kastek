kind: metrics
definitions:
  - key: campaign.recipients.sent
    version: 1
    domain: campaigns
    owner: core-campaigns
    lifecycle: active
    description: Campaign recipients with a recorded send attempt.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - campaign.recipient.sent@1
    formula: count_distinct(campaign.recipient.sent@1, recipient_id)
    eligible_population: campaign recipients with a send attempt in the reporting window
    exclusions: [test recipients]
    time_semantics: event_time
    default_aggregation: distinct_count
    temporal_aggregation: distinct_count
    comparison: previous_period
    deduplication: recipient
    descendant_aggregation: deduplicated
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace]
    dimensions: [campaign, channel, provider, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [campaign.recipient.sent@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: campaign recipient send facts are instrumented
    dependencies: []

