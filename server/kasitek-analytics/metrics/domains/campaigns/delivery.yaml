  - key: campaign.delivery_delay_ms
    version: 1
    domain: campaigns
    owner: core-campaigns
    lifecycle: active
    description: Average time from a campaign send to provider delivery or read acknowledgement.
    value_type: duration
    unit: milliseconds
    precision: 0
    sources:
      - campaign.recipient.timing@1
    formula: average(campaign.recipient.timing@1, duration_ms)
    eligible_population: campaign recipients with a provider timing fact in the reporting window
    exclusions: [test recipients, timing facts without a recorded duration]
    time_semantics: event_time
    default_aggregation: weighted_average
    temporal_aggregation: weighted_average
    comparison: previous_period
    deduplication: recipient
    descendant_aggregation: weighted_average
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace]
    dimensions: [campaign, channel, provider, timing_kind, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [campaign.recipient.timing@1]}
    availability: when_instrumented
    effective_from: "2026-08-24T00:00:00Z"
    applicability: provider delivery and read acknowledgements include measured timing
    dependencies: []

  - key: campaign.delivery_rate
    version: 1
    domain: campaigns
    owner: core-campaigns
    lifecycle: active
    description: Delivered recipients divided by sent recipients.
    value_type: percentage
    unit: fraction
    precision: 4
    sources:
      - campaign.recipient.sent@1
      - campaign.recipient.delivered@1
    formula: safe_divide(campaign.recipients.delivered@1, campaign.recipients.sent@1)
    eligible_population: campaign recipients with both send and delivery facts available
    exclusions: [test recipients, recipients without a send fact]
    numerator: campaign.recipients.delivered@1
    denominator: campaign.recipients.sent@1
    time_semantics: event_time
    default_aggregation: ratio_of_sums
    temporal_aggregation: ratio_of_sums
    comparison: previous_period
    deduplication: recipient
    descendant_aggregation: ratio_of_sums
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace]
    dimensions: [campaign, channel, provider]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [campaign.recipient.sent@1, campaign.recipient.delivered@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: both sent and delivered populations are available
    dependencies: [campaign.recipients.sent@1, campaign.recipients.delivered@1]
