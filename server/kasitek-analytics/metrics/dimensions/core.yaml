kind: dimensions
definitions:
  - key: agent_definition
    type: reference
    source: envelope.subject.agent_definition_id
    compatible_metrics: [agent.runs.completed@1, agent.runs.failed@1]
    filterable: true
    groupable: true
    cardinality: medium
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: agent_version
    type: reference
    source: envelope.data.agent_version_id
    compatible_metrics: [agent.runs.completed@1, agent.runs.failed@1]
    filterable: true
    groupable: true
    cardinality: medium
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: agent_installation
    type: reference
    source: envelope.data.installation_id
    compatible_metrics: [agent.runs.completed@1, agent.runs.failed@1]
    filterable: true
    groupable: true
    cardinality: high
    privacy_class: restricted
    stable_key: true
    permissions: [analytics:read:agent]

  - key: campaign
    type: reference
    source: envelope.data.campaign_id
    compatible_metrics: [campaign.recipients.sent@1, campaign.recipients.delivered@1, campaign.delivery_rate@1]
    filterable: true
    groupable: true
    cardinality: medium
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: channel
    type: enum
    source: envelope.data.channel
    compatible_metrics: [campaign.recipients.sent@1, campaign.recipients.delivered@1, campaign.delivery_rate@1]
    filterable: true
    groupable: true
    cardinality: low
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: provider
    type: reference
    source: envelope.data.provider
    compatible_metrics: [campaign.recipients.sent@1, campaign.recipients.delivered@1, campaign.delivery_rate@1]
    filterable: true
    groupable: true
    cardinality: medium
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: conversation_channel
    type: enum
    source: envelope.data.channel
    compatible_metrics: [conversation.messages.received@1, conversation.responses.recorded@1]
    filterable: true
    groupable: true
    cardinality: low
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: responder_type
    type: enum
    source: envelope.data.responder_type
    compatible_metrics: [conversation.messages.received@1, conversation.responses.recorded@1]
    filterable: true
    groupable: true
    cardinality: low
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: outcome
    type: enum
    source: envelope.data.outcome
    compatible_metrics: [agent.runs.completed@1]
    filterable: true
    groupable: true
    cardinality: low
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: failure_class
    type: enum
    source: envelope.data.failure_class
    compatible_metrics: [agent.runs.failed@1]
    filterable: true
    groupable: true
    cardinality: low
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: status
    type: enum
    source: envelope.data.status
    compatible_metrics: [agent.runs.completed@1, agent.runs.failed@1, campaign.recipients.sent@1, campaign.recipients.delivered@1, conversation.messages.received@1, conversation.responses.recorded@1]
    filterable: true
    groupable: true
    cardinality: low
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]
