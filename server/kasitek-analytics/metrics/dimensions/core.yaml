kind: dimensions
definitions:
  - key: agent_definition
    type: reference
    source: envelope.subject.agent_definition_id
    compatible_metrics: [agent.runs.completed@1, agent.runs.failed@1, agent.tools.lifecycle_events@1, agent.approvals.lifecycle_events@1, agent.effects.lifecycle_events@1, agent.schedules.lifecycle_events@1, agent.installations.lifecycle_events@1, agent.versions.lifecycle_events@1, agent.readiness.evaluations@1]
    filterable: true
    groupable: true
    cardinality: medium
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: agent_version
    type: reference
    source: envelope.data.agent_version_id
    compatible_metrics: [agent.runs.completed@1, agent.runs.failed@1, agent.tools.lifecycle_events@1, agent.approvals.lifecycle_events@1, agent.effects.lifecycle_events@1, agent.schedules.lifecycle_events@1, agent.installations.lifecycle_events@1, agent.versions.lifecycle_events@1, agent.readiness.evaluations@1]
    filterable: true
    groupable: true
    cardinality: medium
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: agent_installation
    type: reference
    source: envelope.data.installation_id
    compatible_metrics: [agent.runs.completed@1, agent.runs.failed@1, agent.tools.lifecycle_events@1, agent.approvals.lifecycle_events@1, agent.effects.lifecycle_events@1, agent.schedules.lifecycle_events@1, agent.installations.lifecycle_events@1, agent.readiness.evaluations@1]
    filterable: true
    groupable: true
    cardinality: high
    privacy_class: restricted
    stable_key: true
    permissions: [analytics:read:agent]

  - key: agent_execution_mode
    type: enum
    source: envelope.data.execution_mode
    compatible_metrics: [agent.installations.lifecycle_events@1]
    filterable: true
    groupable: true
    cardinality: low
    privacy_class: aggregate
    stable_key: true
    permissions: [analytics:read]

  - key: agent_creation_profile
    type: enum
    source: envelope.data.creation_profile
