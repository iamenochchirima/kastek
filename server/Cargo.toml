[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.7"

tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "chrono", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
cuid2 = "0.1"
urlencoding = "2.1"
aes-gcm = "0.10"
sha2 = "0.10"

reqwest = { version = "0.12", features = ["json", "multipart"] }
redis = { version = "0.27", features = ["tokio-comp"] }

env_logger = "0.11"
log = "0.4"
dotenv = "0.15"
thiserror = "2"
base64 = "0.22"
rand = "0.8"
csv = "1.3"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
regex = "1"

[[bin]]
name = "server"
path = "src/main.rs"
