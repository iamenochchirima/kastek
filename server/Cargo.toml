[workspace]
members = [
    "kasitek-core",
    "crates/config",
    "crates/crypto-utils",
    "crates/observability",
    "crates/actions",
    "crates/analytics-producer",
    "crates/analytics-reporting",
    "crates/execution",
    "crates/types",
]
resolver = "2"

# Keep fast local iteration while avoiding full debug information in every
# dependency artifact. Incremental compilation remains enabled intentionally.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
actix-cors = "0.7"
actix-web = "4"
async-trait = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
env_logger = "0.11"
http = "1"
log = "0.4"
opentelemetry = { version = "0.32", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32.1", features = [
    "logs",
    "metrics",
    "trace",
    "rt-tokio",
    "experimental_logs_batch_log_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }
observability = { path = "crates/observability" }
jsonschema = { version = "0.48", default-features = false }
rand = "0.8"
regex = "1"
redis = { version = "0.27", features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-actix-web = { version = "0.7", features = ["opentelemetry_0_32"] }
tracing-log = "0.2"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
