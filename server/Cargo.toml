[workspace]
members = [
    "kasitek-core",
    "kasitek-analytics",
    "kasitek-tenants",
    "crates/config",
    "crates/crypto-utils",
    "crates/observability",
    "crates/actions",
    "crates/analytics-producer",
    "crates/analytics-reporting",
    "crates/execution",
    "crates/types",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
actix-cors = "0.7"
actix-web = "4"
async-trait = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
jsonschema = { version = "0.48", default-features = false }
rand = "0.8"
redis = { version = "0.27", features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
