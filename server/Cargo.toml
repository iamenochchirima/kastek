[workspace]
members = [
    "kasitek-core",
    "kasitek-tenants",
    "crates/config",
    "crates/crypto-utils",
    "crates/observability",
    "crates/types",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
actix-cors = "0.7"
actix-web = "4"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
