kind: metrics
definitions:
  - key: agent.support.lifecycle_events
    version: 1
    domain: agents
    owner: agent-platform
    lifecycle: active
    description: Customer-support handoff, waiting, response and notification outcomes.
    value_type: integer
    unit: count
    precision: 0
    sources: [agent.support.lifecycle@1]
    formula: count(agent.support.lifecycle@1)
    eligible_population: Committed customer-support lifecycle transitions outside evaluation trials.
    exclusions: [evaluation trials, message content, customer identifiers, staff identifiers, summaries and credentials]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [agents_organization]
    dimensions: [agent_definition, agent_version, handoff_channel, lifecycle_action, outcome]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [agent.support.lifecycle@1]}
    availability: when_instrumented
    effective_from: "2026-10-29T00:00:00Z"
    applicability: A support request, acknowledgement, wait milestone, human reply or notification outcome is committed.
    dependencies: []

  - key: agent.support.response_time_ms
    version: 1
    domain: agents
    owner: agent-platform
    lifecycle: active
    description: Time from a committed support request to its acknowledgement or first human reply.
    value_type: duration
    unit: milliseconds
    precision: 0
    sources: [agent.support.lifecycle@1]
    formula: average(agent.support.lifecycle@1, duration_ms)
    eligible_population: Acknowledgement and first-human-reply events with a measured duration.
    exclusions: [evaluation trials, messages without a committed request, customer content and identifiers]
    time_semantics: event_time
    default_aggregation: weighted_average
    temporal_aggregation: weighted_average
    comparison: previous_period
    deduplication: none
    descendant_aggregation: weighted_average
    supported_intervals: [hour, day, week, month]
    scope_kinds: [agents_organization]
    dimensions: [agent_definition, agent_version, handoff_channel, lifecycle_action, outcome]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [agent.support.lifecycle@1]}
    availability: when_instrumented
    effective_from: "2026-10-29T00:00:00Z"
    applicability: An acknowledgement or first human reply is committed for a support episode.
    dependencies: []
