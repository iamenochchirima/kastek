kind: metrics
definitions:
  - key: conversation.lifecycle_events
    version: 1
    domain: inbox
    owner: core-inbox
    lifecycle: active
    description: Core Inbox conversation lifecycle transitions.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - conversation.lifecycle@1
    formula: count(conversation.lifecycle@1)
    eligible_population: persisted Core Inbox conversation lifecycle facts
    exclusions: [conversation titles, previews, customer identifiers, and message content]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [conversation_channel, lifecycle_action, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [conversation.lifecycle@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: Core Inbox conversation lifecycle commands are instrumented
    dependencies: []

  - key: conversation.message.lifecycle_events
    version: 1
    domain: inbox
    owner: core-inbox
    lifecycle: active
    description: Core Inbox message creation and delivery lifecycle transitions.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - conversation.message.lifecycle@1
    formula: count(conversation.message.lifecycle@1)
    eligible_population: persisted Core Inbox message lifecycle facts
    exclusions: [message content, provider message identifiers, customer identifiers, and credentials]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: source_entity
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [conversation_channel, message_action, message_direction, responder_type, message_type, message_delivery_status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [conversation.message.lifecycle@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: Core Inbox messages are persisted or their delivery status changes
    dependencies: []

  - key: conversation.response_time_ms
    version: 1
    domain: inbox
    owner: core-inbox
    lifecycle: active
    description: Time from the latest customer message to a human or Agent response.
    value_type: duration
    unit: milliseconds
    precision: 0
    sources:
      - conversation.message.lifecycle@1
    formula: average(conversation.message.lifecycle@1, response_time_ms)
    eligible_population: outbound human or Agent messages with a preceding customer message
    exclusions: [inbound messages, system messages, messages without a preceding customer message]
    time_semantics: event_time
    default_aggregation: weighted_average
    temporal_aggregation: weighted_average
    comparison: previous_period
    deduplication: source_entity
    descendant_aggregation: weighted_average
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [conversation_channel, responder_type]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [conversation.message.lifecycle@1]}
    availability: when_applicable
    effective_from: "2026-08-22T00:00:00Z"
    applicability: an Inbox conversation has a human or Agent response after a customer message
    dependencies: []

  - key: conversation.messages.received
    version: 1
    domain: inbox
    owner: core-inbox
    lifecycle: active
    description: Customer messages received by the inbox.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - conversation.message.received@1
    formula: count(conversation.message.received@1)
    eligible_population: customer messages received by instrumented inboxes
    exclusions: [internal system messages]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [conversation_channel, responder_type, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [conversation.message.received@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: inbox message facts are instrumented
    dependencies: []

  - key: conversation.responses.recorded
    version: 1
    domain: inbox
    owner: core-inbox
    lifecycle: active
    description: Responses recorded by an agent, human, or system.
    value_type: integer
    unit: count
    precision: 0
    sources:
      - conversation.response.recorded@1
    formula: count(conversation.response.recorded@1)
    eligible_population: responses recorded by instrumented agents, humans, or systems
    exclusions: [internal system messages without a response]
    time_semantics: event_time
    default_aggregation: count
    temporal_aggregation: sum
    comparison: previous_period
    deduplication: none
    descendant_aggregation: sum
    supported_intervals: [hour, day, week, month]
    scope_kinds: [core_organization, tenant_workspace, tenant_client]
    dimensions: [conversation_channel, responder_type, status]
    permissions: [analytics:read]
    privacy_class: aggregate
    exactness: exact
    freshness: {max_age_seconds: 3600, late_data_window_seconds: 86400}
    coverage: {mode: partial, required_sources: [conversation.response.recorded@1]}
    availability: when_instrumented
    effective_from: "2026-08-22T00:00:00Z"
    applicability: response facts are instrumented
    dependencies: []
