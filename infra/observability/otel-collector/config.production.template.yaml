# Provider-neutral production template. Do not deploy until the backend, retention, access,
# ownership, and data-handling decisions are approved. OTEL_BACKEND_ENDPOINT is an OTLP base URL;
# it may point to Axiom or another backend later without changing application instrumentation.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource/normalize:
    attributes:
      - key: service.namespace
        value: kasitek
        action: upsert
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: api_key
        action: delete
      - key: access_token
        action: delete
      - key: refresh_token
        action: delete
      - key: client_secret
        action: delete
      - key: apiKey
        action: delete
      - key: accessToken
        action: delete
      - key: refreshToken
        action: delete
      - key: clientSecret
        action: delete
      - key: token
        action: delete
      - key: secret
        action: delete
      - key: password
        action: delete
      - key: prompt
        action: delete
      - key: body.messages
        action: delete
      - key: body.prompt
        action: delete
      - key: body.content
        action: delete
      - key: message.content
        action: delete
      - key: http.target
        action: delete
  batch:
    send_batch_size: 1024
    timeout: 5s
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: preserve-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 20

exporters:
  otlp_http/backend:
    endpoint: ${env:OTEL_BACKEND_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_BACKEND_AUTH}
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

extensions:
  health_check:
    endpoint: 0.0.0.0:${env:PORT}

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/normalize, attributes/redact, tail_sampling, batch]
      exporters: [otlp_http/backend]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/normalize, attributes/redact, batch]
      exporters: [otlp_http/backend]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/normalize, attributes/redact, batch]
      exporters: [otlp_http/backend]
