name: kasitek-otel-collector

services:
  otel-collector:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - "${OTEL_COLLECTOR_CONFIG:-./config.local.yaml}:/etc/otelcol/config.yaml:ro"
    environment:
      PORT: "13133"
    ports:
      - "${OTEL_COLLECTOR_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_OTLP_HTTP_HOST_PORT:-4318}:4318"
      - "${OTEL_COLLECTOR_HEALTH_HOST_PORT:-13133}:13133"
    restart: unless-stopped
