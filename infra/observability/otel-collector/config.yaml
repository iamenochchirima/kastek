# Provider-neutral baseline. The debug exporter is intentional until a durable
# observability backend is selected in a separate provider plan.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  resource/normalize:
    attributes:
      - key: service.namespace
        value: kasitek
        action: upsert
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: api_key
        action: delete
      - key: access_token
        action: delete
      - key: refresh_token
        action: delete
      - key: client_secret
        action: delete
      - key: apiKey
        action: delete
      - key: accessToken
        action: delete
      - key: refreshToken
        action: delete
      - key: clientSecret
        action: delete
      - key: token
        action: delete
      - key: secret
        action: delete
      - key: password
        action: delete
      - key: prompt
        action: delete
      - key: body.messages
        action: delete
      - key: body.prompt
        action: delete
      - key: body.content
        action: delete
      - key: message.content
        action: delete
      - key: http.target
        action: delete
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:${env:PORT}

service:
  extensions:
    - health_check
  telemetry:
    metrics:
      level: normal
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/normalize, attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/normalize, attributes/redact, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/normalize, attributes/redact, batch]
      exporters: [debug]
